name: Actualizar agenda

on:
  schedule:
    - cron: "17 9,21 * * *"   # dos veces por día: 06:17 y 18:17 hora de Buenos Aires
  workflow_dispatch:           # botón "Run workflow" para correrlo a mano
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Probar los lectores
        run: npm test

      - name: Juntar eventos
        run: npm run scrape

      - name: Guardar los datos en el repositorio
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@users.noreply.github.com"
          git add site/data/events.json
          git diff --cached --quiet || git commit -m "Agenda actualizada $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
