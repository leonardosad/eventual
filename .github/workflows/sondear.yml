name: Sondear sitio (diagnóstico)

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs a revisar, separadas por espacios"
        required: true

jobs:
  sondear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
      - run: node tools/sondear.mjs ${{ inputs.urls }}
